<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technical Skill Matrix</title>
    <style>
        /* --- SIMPLIFIED CSS --- */
        body { 
            font-family: sans-serif; 
            padding: 20px; 
            background: #f4f4f4; 
            color: #333; 
        }
        
        .matrix-box { 
            max-width: 500px; 
            margin: auto; 
            background: white; 
            padding: 20px; 
            border: 1px solid #ccc; 
        }

        .skill-item { 
            display: flex; 
            justify-content: space-between; 
            padding: 8px 0; 
            border-bottom: 1px solid #eee; 
        }

        .edit-btn { 
            cursor: pointer; 
            padding: 4px 8px; 
        }

        .nav-links { margin-top: 20px; border-top: 1px solid #ccc; padding-top: 10px; }
        .nav-links a { display: block; margin: 5px 0; font-size: 14px; color: blue; }
    </style>
</head>
<body>

    <div class="matrix-box">
        <h2>Technical Skill Matrix</h2>

        <ol>
            <li>
                <strong>Software Development</strong>
                <ul>
                    <li class="skill-item">
                        <span id="s1">C (Systems Programming & Sockets)</span>
                        <button class="edit-btn" onclick="modifySkill('s1')">Edit</button>
                    </li>
                    <li class="skill-item">
                        <span id="s2">Java (Object-Oriented Development)</span>
                        <button class="edit-btn" onclick="modifySkill('s2')">Edit</button>
                    </li>
                </ul>
            </li>

            <li>
                <strong>Database Systems</strong>
                <ul>
                    <li class="skill-item">
                        <span id="s3">SQL (Relational Database Management)</span>
                        <button class="edit-btn" onclick="modifySkill('s3')">Edit</button>
                    </li>
                </ul>
            </li>
        </ol>

        <div class="nav-links">
            <a href="four.html">← Back to Page four</a>
            <a href="six.html">Go to Assignment six →</a>
            <a href="https://Keerthan2718.github.io/Keerthan_sem4_fet/Assignment/html_with_css/five_css.html">View CSS Version</a>
        </div>
    </div>

    <script>
        function modifySkill(id) {
            const skillTarget = document.getElementById(id);
            const currentText = skillTarget.textContent;

            let updatedText = prompt("Enter the updated skill details:", currentText);

            if (updatedText === null) {
                alert("Update cancelled.");
            } else if (updatedText.trim() === "") {
                alert("Error: Skill description cannot be empty.");
            } else {
                skillTarget.textContent = updatedText;
                alert("Success! System updated to: " + updatedText);
            }
        }
    </script>
    	<center>
		 <a href="https://Keerthan2718.github.io/Keerthan_sem4_fet/">Home page</a>
        </center>

</body>
</html>
